<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Salary Predictor: Estimate a posting&#x27;s salary from role, education, industry and experience">
<title>Salary Predictor</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#e3b341"/></linearGradient></defs>
<style>
.t{font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc} .s{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9da7b3} .c{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3} .k{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950;letter-spacing:.2em}
.w{fill:none;stroke-width:2;stroke-opacity:.35;stroke-dasharray:6 10;animation:flow 6s linear infinite}
.p{animation:tw 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-160}} @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
